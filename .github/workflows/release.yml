name: Release Windows Build
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          Expand-Archive -Path LCE-Emerald-Launcher-1.3.0.zip -DestinationPath . -Force
          xcopy .\LCE-Emerald-Launcher-1.3.0\* . /E /Y /Q
          Remove-Item -Path .\LCE-Emerald-Launcher-1.3.0 -Recurse -Force

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone application
        run: pnpm tauri build --no-bundle

      - name: Upload Windows Standalone App
        uses: actions/upload-artifact@v4
        with:
          name: Emerald-Launcher-Windows
          path: src-tauri/target/release/emerald-legacy-launcher.exe
