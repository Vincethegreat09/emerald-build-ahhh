name: Release Windows Build
on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          Expand-Archive -Path LCE-Emerald-Launcher-1.3.0.zip -DestinationPath . -Force
          # Move the contents out cleanly without messing up case sensitivity
          xcopy .\LCE-Emerald-Launcher-1.3.0\* . /E /Y /Q
          Remove-Item -Path .\LCE-Emerald-Launcher-1.3.0 -Recurse -Force

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.3.0
          releaseName: 'Emerald Launcher v1.3.0'
          releaseBody: 'Automated Windows build for Caty.'
          releaseDraft: true
          prerelease: false
